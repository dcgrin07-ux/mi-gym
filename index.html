<script>
    /* ==========================================
       CONFIGURACIÓN FIREBASE (Cloud Firestore)
       ========================================== */
    const firebaseConfig = {
        apiKey: "AIzaSyA3N-mLUaTF9jUshNosUiWpso0-934H_fo",
        authDomain: "mygymlacima.firebaseapp.com",
        projectId: "mygymlacima",
        storageBucket: "mygymlacima.firebasestorage.app",
        messagingSenderId: "398491160791",
        appId: "1:398491160791:web:91346182b9c06588d6e092"
    };

    let dbCloud = null;
    let usarseNube = false;

    try {
        firebase.initializeApp(firebaseConfig);
        dbCloud = firebase.firestore();
        usarseNube = true;
    } catch(e) {
        console.log("Firebase no configurado o modo offline local:", e);
    }

    /* ==========================================
       CATÁLOGO DE EJERCICIOS + OPCIÓN PERSONALIZADA
       ========================================== */
    const catalogoEjercicios = [
        "PRESS PLANO", "PRESS INCLINADO MANC", "CROSSOVER CON BANCO", "FLEXIONES",
        "PRESS MILITAR", "VUELO LATERAL", "SENTADILLA / HACK", "BÚLGARAS",
        "FLEXIÓN DE ISQUIOS", "SILLÓN DE CUÁDRICEPS", "GEMELOS", "BÍCEPS CON BARRA",
        "CURL ARAÑA", "PESO MUERTO", "DOMINADAS", "DORSALERA", "REMO GIRONDA",
        "FACE PULL", "PRESS FRANCÉS", "TRÍCEPS POLEA", "HIP THRUST", "PATADA DE GLÚTEOS",
        "Caminar 🚶‍♂️", "Trotar / Correr 🏃‍♂️", "Ciclismo 🚴‍♂️", "Natación 🏊‍♂️",
        "➕ OTRO (Escribir nombre personalizado)..."
    ];

    /* ==========================================
       ESTADO DE LA APLICACIÓN
       ========================================== */
    let rutinasPersonalizadas = JSON.parse(localStorage.getItem('mi_gym_rutinas_v33') || JSON.stringify({
        "Rutina A": []
    }));

    let registrosCloud = JSON.parse(localStorage.getItem('mi_gym_registros_v33') || '[]');
    let perfilCloud = JSON.parse(localStorage.getItem('mi_gym_perfil_v33') || '{"peso": 90}');
    let borradorSesion = JSON.parse(localStorage.getItem('mi_gym_borrador_v33') || 'null');

    let rutinaSeleccionadaKey = '';
    let guiadoIndice = 0;
    let cronometroSesionInterval = null;
    let segundosSesion = 0;
    let descansoInterval = null;
    let segundosDescansoRestantes = 90;
    let calAnioActual = new Date().getFullYear();
    let calMesActual = new Date().getMonth();

    async function sincronizarConNubeAlIniciar() {
        if(!usarseNube || !dbCloud) {
            actualizarEstadoCloud(false, "Modo Local (Backup JSON)");
            actualizarDashboard();
            return;
        }
        try {
            actualizarEstadoCloud(false, "Sincronizando...");
            let docRef = dbCloud.collection("usuarios").doc("usuario_principal");
            let doc = await docRef.get();
            if(doc.exists) {
                let data = doc.data();
                if(data.rutinas) rutinasPersonalizadas = data.rutinas;
                if(data.registros) registrosCloud = data.registros;
                if(data.perfil) perfilCloud = data.perfil;
                guardarLocal();
            } else {
                await docRef.set({ rutinas: rutinasPersonalizadas, registros: registrosCloud, perfil: perfilCloud });
            }
            actualizarEstadoCloud(true, "☁️ Sincronizado en Nube");
            actualizarDashboard();
        } catch(err) {
            actualizarEstadoCloud(false, "⚠️ Error de Red (Local activo)");
            actualizarDashboard();
        }
    }

    async function guardarTodoEnNube() {
        guardarLocal();
        if(!usarseNube || !dbCloud) return;
        try {
            actualizarEstadoCloud(false, "Guardando...");
            await dbCloud.collection("usuarios").doc("usuario_principal").set({
                rutinas: rutinasPersonalizadas,
                registros: registrosCloud,
                perfil: perfilCloud
            });
            actualizarEstadoCloud(true, "☁️ Nube Actualizada");
        } catch(e) {
            actualizarEstadoCloud(false, "⚠️ Error al sincronizar");
        }
    }

    function guardarLocal() {
        localStorage.setItem('mi_gym_rutinas_v33', JSON.stringify(rutinasPersonalizadas));
        localStorage.setItem('mi_gym_registros_v33', JSON.stringify(registrosCloud));
        localStorage.setItem('mi_gym_perfil_v33', JSON.stringify(perfilCloud));
        localStorage.setItem('mi_gym_borrador_v33', JSON.stringify(borradorSesion));
    }

    function actualizarEstadoCloud(sincronizado, texto) {
        const dot = document.getElementById('cloud-dot');
        const txt = document.getElementById('cloud-text');
        if (dot && txt) {
            dot.className = sincronizado ? "cloud-dot sync" : "cloud-dot offline";
            txt.innerText = texto;
        }
    }

    function irA(viewId) {
        document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
        const targetView = document.getElementById(viewId);
        if (targetView) targetView.classList.add('active');
        
        document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
        
        if(viewId === 'view-home') {
            const navBtn = document.querySelectorAll('.nav-btn')[0];
            if (navBtn) navBtn.classList.add('active');
            actualizarDashboard();
        } else if(viewId === 'view-calendario') {
            const navBtn = document.querySelectorAll('.nav-btn')[1];
            if (navBtn) navBtn.classList.add('active');
            renderizarCalendario();
        } else if(viewId === 'view-historial') {
            const navBtn = document.querySelectorAll('.nav-btn')[2];
            if (navBtn) navBtn.classList.add('active');
            renderizarHistorial();
        } else if(viewId === 'view-records') {
            renderizarRecords();
        }
        window.scrollTo(0,0);
    }

    function actualizarDashboard() {
        const pesoCorp = document.getElementById('label-peso-corporal');
        if (pesoCorp) pesoCorp.innerText = `${perfilCloud.peso || '--'} kg`;
        
        const bannerBorrador = document.getElementById('banner-borrador-activo');
        if(bannerBorrador) {
            bannerBorrador.style.display = borradorSesion ? 'block' : 'none';
        }

        const ultimoEntreno = document.getElementById('dash-ultimo-entreno');
        if (ultimoEntreno) {
            if(registrosCloud.length > 0) {
                let ultimo = registrosCloud[0];
                ultimoEntreno.innerText = `${ultimo.fecha} (${ultimo.rutina})`;
            } else {
                ultimoEntreno.innerText = 'Ninguno';
            }
        }

        let mesActualStr = String(new Date().getMonth() + 1).padStart(2, '0');
        let anioActualStr = String(new Date().getFullYear());
        
        let regsMes = registrosCloud.filter(r => {
            if (!r.fecha) return false;
            let p = r.fecha.split('/');
            return p[1] === mesActualStr && p[2] === anioActualStr;
        });

        let diasUnicos = new Set(regsMes.map(r => r.fecha)).size;
        const cantMes = document.getElementById('dash-cant-mes');
        if (cantMes) cantMes.innerText = diasUnicos;

        let volMes = regsMes.reduce((acc, r) => acc + (r.volumen || 0), 0);
        const volMesEl = document.getElementById('dash-volumen-mes');
        if (volMesEl) volMesEl.innerText = `${volMes.toLocaleString()} kg`;

        let kcalMes = regsMes.reduce((acc, r) => acc + (r.calorias || 0), 0);
        const kcalMesEl = document.getElementById('dash-calorias-mes');
        if (kcalMesEl) kcalMesEl.innerText = `${kcalMes.toLocaleString()} kcal`;

        const cont = document.getElementById('lista-rutinas-home-container');
        if (!cont) return;
        
        let html = '';
        Object.keys(rutinasPersonalizadas).forEach(key => {
            let cantEjercicios = Array.isArray(rutinasPersonalizadas[key]) ? rutinasPersonalizadas[key].length : 0;
            html += `
                <div class="flex-row" style="margin-bottom: 8px;">
                    <button class="btn btn-primary" style="margin:0; flex:1;" onclick="seleccionarRutina('${key}')">📅 ${key} (${cantEjercicios} ejercicios)</button>
                    <button class="btn btn-danger" style="width: auto; margin:0; padding: 12px 14px;" onclick="eliminarRutina('${key}')">🗑️</button>
                </div>
            `;
        });
        cont.innerHTML = html || '<p style="color:var(--text-muted); font-size:0.9rem;">No hay rutinas creadas todavía.</p>';
    }

    function abrirModalCrearRutina() { 
        const input = document.getElementById('input-nombre-nueva-rutina');
        if (input) input.value = ''; 
        const modal = document.getElementById('modal-crear-rutina');
        if (modal) modal.style.display = 'flex'; 
    }
    
    function cerrarModalCrearRutina() { 
        const modal = document.getElementById('modal-crear-rutina');
        if (modal) modal.style.display = 'none'; 
    }
    
    function guardarNuevaRutinaCreada() {
        let inputNombre = document.getElementById('input-nombre-nueva-rutina');
        if (!inputNombre) return;
        let nombre = inputNombre.value.trim();
        
        if(nombre !== "") {
            if(!rutinasPersonalizadas[nombre]) {
                rutinasPersonalizadas[nombre] = [];
                guardarTodoEnNube();
            }
            cerrarModalCrearRutina();
            actualizarDashboard();
        } else {
            alert("Por favor, ingresá un nombre válido para la rutina.");
        }
    }

    function eliminarRutina(key) {
        if(confirm(`¿Estás seguro de eliminar la rutina "${key}"?`)) {
            delete rutinasPersonalizadas[key];
            guardarTodoEnNube();
            actualizarDashboard();
        }
    }

    function seleccionarRutina(key) {
        rutinaSeleccionadaKey = key;
        if (!Array.isArray(rutinasPersonalizadas[rutinaSeleccionadaKey])) {
            rutinasPersonalizadas[rutinaSeleccionadaKey] = [];
        }
        
        const tituloRutina = document.getElementById('titulo-rutina-activa');
        if (tituloRutina) tituloRutina.innerText = key;
        
        const sel = document.getElementById('select-catalogo-agregar');
        if (sel) {
            let h = '';
            catalogoEjercicios.forEach(e => h += `<option value="${e}">${e}</option>`);
            sel.innerHTML = h;
            verificarOpcionCatalogo();
        }

        renderizarEjerciciosRutinaActual();
        irA('view-rutina');
    }

    function verificarOpcionCatalogo() {
        const sel = document.getElementById('select-catalogo-agregar');
        if (!sel) return;
        let val = sel.value;
        let esCustom = val.includes("➕ OTRO");
        let esCardio = val.includes("🚶‍♂️") || val.includes("🏃‍♂️") || val.includes("🚴‍♂️") || val.includes("🏊‍♂️");
        
        const divCustom = document.getElementById('div-nombre-personalizado');
        const divCardio = document.getElementById('div-cardio-inputs');
        const divFuerza = document.getElementById('div-fuerza-inputs');

        if (divCustom) divCustom.style.display = esCustom ? 'block' : 'none';
        if (divCardio) divCardio.style.display = esCardio ? 'block' : 'none';
        if (divFuerza) divFuerza.style.display = esCardio ? 'none' : 'block';
    }

    function agregarEjercicioARutinaActual() {
        const sel = document.getElementById('select-catalogo-agregar');
        if (!sel) return;
        let selVal = sel.value;
        let nombreFinal = "";

        if(selVal.includes("➕ OTRO")) {
            let inputCustom = document.getElementById('input-ejercicio-custom');
            nombreFinal = inputCustom ? inputCustom.value.trim().toUpperCase() : "";
            if(!nombreFinal) { alert("Ingresá un nombre para el ejercicio."); return; }
        } else {
            nombreFinal = selVal;
        }

        let esCardio = nombreFinal.includes("🚶‍♂️") || nombreFinal.includes("🏃‍♂️") || nombreFinal.includes("🚴‍♂️") || nombreFinal.includes("🏊‍♂️");
        
        if(!Array.isArray(rutinasPersonalizadas[rutinaSeleccionadaKey])) {
            rutinasPersonalizadas[rutinaSeleccionadaKey] = [];
        }

        if(esCardio) {
            let mins = parseInt(document.getElementById('cardio-minutos')?.value) || 20;
            let km = parseFloat(document.getElementById('cardio-km')?.value) || 0;
            let notas = document.getElementById('cardio-notas')?.value.trim() || "";
            rutinasPersonalizadas[rutinaSeleccionadaKey].push({ nombre: nombreFinal, minutos: mins, km, notas, tipo: "cardio" });
        } else {
            let series = parseInt(document.getElementById('input-series-nuevo')?.value) || 3;
            let pesoRef = parseFloat(document.getElementById('input-peso-nuevo')?.value) || 0;
            let reps = document.getElementById('input-reps-nuevo')?.value.trim() || "8-10";
            let notas = document.getElementById('input-notas-nuevo')?.value.trim() || "";
            rutinasPersonalizadas[rutinaSeleccionadaKey].push({ nombre: nombreFinal, series, pesoRef, reps, notas, tipo: "fuerza" });
        }
        guardarTodoEnNube();
        renderizarEjerciciosRutinaActual();
    }

    function eliminarEjercicioDeRutina(idx) {
        if (Array.isArray(rutinasPersonalizadas[rutinaSeleccionadaKey])) {
            rutinasPersonalizadas[rutinaSeleccionadaKey].splice(idx, 1);
            guardarTodoEnNube();
            renderizarEjerciciosRutinaActual();
        }
    }

    function abrirModalEditarEjercicio(idx) {
        let item = rutinasPersonalizadas[rutinaSeleccionadaKey]?.[idx];
        if (!item) return;
        
        const idxEl = document.getElementById('edit-ej-idx');
        const seriesEl = document.getElementById('edit-ej-series');
        const pesoEl = document.getElementById('edit-ej-peso');
        const repsEl = document.getElementById('edit-ej-reps');
        const notasEl = document.getElementById('edit-ej-notas');
        const modal = document.getElementById('modal-editar-ejercicio');

        if (idxEl) idxEl.value = idx;
        if (seriesEl) seriesEl.value = item.series || 3;
        if (pesoEl) pesoEl.value = item.pesoRef || 0;
        if (repsEl) repsEl.value = item.reps || "8-10";
        if (notasEl) notasEl.value = item.notas || "";
        if (modal) modal.style.display = 'flex';
    }
    
    function cerrarModalEditarEjercicio() { 
        const modal = document.getElementById('modal-editar-ejercicio');
        if (modal) modal.style.display = 'none'; 
    }
    
    function guardarEdicionEjercicio() {
        let idxInput = document.getElementById('edit-ej-idx');
        if (!idxInput) return;
        let idx = parseInt(idxInput.value);
        let item = rutinasPersonalizadas[rutinaSeleccionadaKey]?.[idx];
        if (!item) return;

        item.series = parseInt(document.getElementById('edit-ej-series')?.value) || 3;
        item.pesoRef = parseFloat(document.getElementById('edit-ej-peso')?.value) || 0;
        item.reps = document.getElementById('edit-ej-reps')?.value.trim() || "8-10";
        item.notas = document.getElementById('edit-ej-notas')?.value.trim() || "";
        
        guardarTodoEnNube();
        cerrarModalEditarEjercicio();
        renderizarEjerciciosRutinaActual();
    }

    function renderizarEjerciciosRutinaActual() {
        const cont = document.getElementById('lista-ejercicios-container');
        if (!cont) return;
        const lista = rutinasPersonalizadas[rutinaSeleccionadaKey] || [];
        let html = '';
        
        if(lista.length === 0) {
            html = '<p style="color:var(--text-muted); font-size:0.9rem;">Esta rutina está vacía. Agregá tu primer ejercicio arriba.</p>';
        }

        lista.forEach((item, idx) => {
            if(item.tipo === "cardio") {
                html += `
                    <div class="card exercise-card">
                        <div class="flex-row" style="justify-content: space-between; align-items: flex-start;">
                            <div>
                                <h3 style="color: var(--orange); font-size: 1.05rem; margin-bottom: 4px;">${idx+1}. ${item.nombre}</h3>
                                <p style="color: var(--text-muted); font-size: 0.85rem;">Cardio | ${item.minutos} mins ${item.km ? `| ${item.km} km` : ''}</p>
                                ${item.notas ? `<p style="color: var(--yellow); font-size: 0.85rem; margin-top: 6px; font-style: italic; white-space: pre-wrap;">📝 ${item.notas}</p>` : ''}
                            </div>
                            <div class="flex-row" style="gap:5px;">
                                <button class="btn btn-secondary" style="width: auto; margin:0; padding: 6px 10px; font-size: 0.8rem;" onclick="abrirModalEditarEjercicio(${idx})">✏️</button>
                                <button class="btn btn-danger" style="width: auto; margin:0; padding: 6px 10px; font-size: 0.8rem;" onclick="eliminarEjercicioDeRutina(${idx})">🗑️</button>
                            </div>
                        </div>
                    </div>
                `;
            } else {
                html += `
                    <div class="card exercise-card">
                        <div class="flex-row" style="justify-content: space-between; align-items: flex-start;">
                            <div>
                                <h3 style="color: var(--accent); font-size: 1.05rem; margin-bottom: 4px;">${idx+1}. ${item.nombre}</h3>
                                <p style="color: var(--text-muted); font-size: 0.85rem;">Series: ${item.series} | Peso ref: <b>${item.pesoRef || 0} kg</b> | Reps: ${item.reps}</p>
                                ${item.notas ? `<p style="color: var(--yellow); font-size: 0.85rem; margin-top: 6px; font-style: italic; white-space: pre-wrap;">📝 ${item.notas}</p>` : ''}
                            </div>
                            <div class="flex-row" style="gap:5px;">
                                <button class="btn btn-secondary" style="width: auto; margin:0; padding: 6px 10px; font-size: 0.8rem;" onclick="abrirModalEditarEjercicio(${idx})">✏️</button>
                                <button class="btn btn-danger" style="width: auto; margin:0; padding: 6px 10px; font-size: 0.8rem;" onclick="eliminarEjercicioDeRutina(${idx})">🗑️</button>
                            </div>
                        </div>
                    </div>
                `;
            }
        });
        cont.innerHTML = html;
    }

    function comenzarModoGuiado() {
        const lista = rutinasPersonalizadas[rutinaSeleccionadaKey];
        if(!lista || lista.length === 0) {
            alert("Agregá al menos un ejercicio a la rutina antes de comenzar.");
            return;
        }
        
        borradorSesion = {
            rutinaKey: rutinaSeleccionadaKey,
            indice: 0,
            segundosSesion: 0,
            progresoEjercicios: []
        };
        guardarLocal();

        guiadoIndice = 0;
        segundosSesion = 0;
        iniciarCronometroSesion();
        irA('view-guiado');
        cargarPasoGuiado();
    }

    function retomarEntrenamientoBorrador() {
        if(!borradorSesion) return;
        rutinaSeleccionadaKey = borradorSesion.rutinaKey;
        guiadoIndice = borradorSesion.indice || 0;
        segundosSesion = borradorSesion.segundosSesion || 0;
        
        iniciarCronometroSesion();
        irA('view-guiado');
        cargarPasoGuiado();
    }

    function guardarBorradorYVolver() {
        guardarProgresoActualBorrador();
        if(cronometroSesionInterval) clearInterval(cronometroSesionInterval);
        if(descansoInterval) clearInterval(descansoInterval);
        irA('view-home');
    }

    function descartarBorrador() {
        if(confirm("¿Estás seguro de descartar este entrenamiento en curso?")) {
            borradorSesion = null;
            guardarLocal();
            if(cronometroSesionInterval) clearInterval(cronometroSesionInterval);
            if(descansoInterval) clearInterval(descansoInterval);
            irA('view-home');
        }
    }

    function guardarProgresoActualBorrador() {
        if(!borradorSesion) return;
        borradorSesion.indice = guiadoIndice;
        borradorSesion.segundosSesion = segundosSesion;
        guardarLocal();
    }

    function iniciarCronometroSesion() {
        if(cronometroSesionInterval) clearInterval(cronometroSesionInterval);
        cronometroSesionInterval = setInterval(() => {
            segundosSesion++;
            let m = Math.floor(segundosSesion / 60);
            let s = segundosSesion % 60;
            const crono = document.getElementById('cronometro-sesion');
            if (crono) crono.innerText = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
        }, 1000);
    }

    function cargarPasoGuiado() {
        const lista = rutinasPersonalizadas[rutinaSeleccionadaKey];
        if (!lista || !lista[guiadoIndice]) return;
        const item = lista[guiadoIndice];
        
        const prog = document.getElementById('guiado-progreso');
        const nom = document.getElementById('guiado-nombre');
        const expIa = document.getElementById('guiado-explicacion-ia');
        const check = document.getElementById('check-realizado');
        const obs = document.getElementById('guiado-obs');

        if (prog) prog.innerText = `Ejercicio ${guiadoIndice + 1} de ${lista.length}`;
        if (nom) nom.innerText = item.nombre;
        if (expIa) expIa.style.display = 'none';
        if (check) check.checked = true;
        if (obs) obs.value = '';

        const divNotas = document.getElementById('guiado-notas-propias');
        if (divNotas) {
            if(item.notas) {
                divNotas.style.display = 'block';
                divNotas.innerText = `📝 Notas técnicas guardadas:\n${item.notas}`;
            } else {
                divNotas.style.display = 'none';
            }
        }

        const secFuerza = document.getElementById('guiado-seccion-fuerza');
        const secCardio = document.getElementById('guiado-seccion-cardio');
        const meta = document.getElementById('guiado-meta');

        if(item.tipo === "cardio") {
            if (meta) meta.innerText = `Actividad aeróbica`;
            if (secFuerza) secFuerza.style.display = 'none';
            if (secCardio) secCardio.style.display = 'block';
            
            const cardMins = document.getElementById('guiado-cardio-mins');
            const cardKm = document.getElementById('guiado-cardio-km');
            if (cardMins) cardMins.value = item.minutos || 20;
            if (cardKm) cardKm.value = item.km || '';
        } else {
            if (meta) meta.innerText = `Series programadas: ${item.series} | Reps objetivo: ${item.reps}`;
            if (secFuerza) secFuerza.style.display = 'block';
            if (secCardio) secCardio.style.display = 'none';

            let pesoSugerido = item.pesoRef || 0;
            for(let reg of registrosCloud) {
                if(reg.detalle) {
                    let encontrado = reg.detalle.find(d => d.nombre === item.nombre && d.tipo === "fuerza" && d.peso);
                    if(encontrado) { pesoSugerido = encontrado.peso; break; }
                }
            }

            const lblPeso = document.getElementById('label-guiado-peso');
            const gPeso = document.getElementById('guiado-peso');
            const gReps = document.getElementById('guiado-reps');

            if (lblPeso) lblPeso.innerText = `Peso utilizado (kg):`;
            if (gPeso) gPeso.value = pesoSugerido;
            if (gReps) gReps.value = item.reps || "8-10";
        }
    }

    function explicarEjercicioActualIA() {
        const item = rutinasPersonalizadas[rutinaSeleccionadaKey]?.[guiadoIndice];
        if (!item) return;
        const box = document.getElementById('guiado-explicacion-ia');
        if (!box) return;
        box.style.display = 'block';
        box.innerText = `🤖 Sugerencia Técnica IA para "${item.nombre}":\n` +
        `• Enfoque: Mantener control absoluto en la fase excéntrica y máxima contracción.\n` +
        (item.notas ? `• Tus notas actuales: "${item.notas}"` : '• Tip: Podés editar este ejercicio para agregar tus propias instrucciones.');
    }

    function iniciarCronometroDescanso(segundos = 90) {
        segundosDescansoRestantes = segundos;
        const timerContainer = document.getElementById('timer-box-container');
        if (timerContainer) timerContainer.style.display = 'block';
        if(descansoInterval) clearInterval(descansoInterval);
        
        actualizarDisplayDescanso();
        descansoInterval = setInterval(() => {
            segundosDescansoRestantes--;
            actualizarDisplayDescanso();
            if(segundosDescansoRestantes <= 0) {
                clearInterval(descansoInterval);
                alert("⏱️ ¡Descanso finalizado!");
                if (timerContainer) timerContainer.style.display = 'none';
            }
        }, 1000);
    }
    
    function setearDescanso(s) { 
        if(descansoInterval) clearInterval(descansoInterval); 
        iniciarCronometroDescanso(s); 
    }
    
    function detenerDescanso() { 
        if(descansoInterval) clearInterval(descansoInterval); 
        const timerContainer = document.getElementById('timer-box-container');
        if (timerContainer) timerContainer.style.display = 'none'; 
    }
    
    function actualizarDisplayDescanso() {
        let m = Math.floor(segundosDescansoRestantes / 60);
        let s = segundosDescansoRestantes % 60;
        const disp = document.getElementById('display-descanso');
        if (disp) disp.innerText = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
    }

    function guiadoSiguiente() {
        guardarPasoActualBorradorParcial();
        guiadoIndice++;
        const lista = rutinasPersonalizadas[rutinaSeleccionadaKey];
        if(guiadoIndice < lista.length) {
            detenerDescanso();
            cargarPasoGuiado();
        } else {
            finalizarEntrenamientoGuiado();
        }
    }

    function guiadoAnterior() {
        if(guiadoIndice > 0) { 
            guiadoIndice--; 
            cargarPasoGuiado(); 
        }
    }

    function guardarPasoActualBorradorParcial() {
        if(!borradorSesion) return;
        if(!borradorSesion.progresoEjercicios) borradorSesion.progresoEjercicios = [];
        
        const lista = rutinasPersonalizadas[rutinaSeleccionadaKey];
        if (!lista || !lista[guiadoIndice]) return;
        let item = lista[guiadoIndice];
        let realizadoCheck = document.getElementById('check-realizado');
        let realizado = realizadoCheck ? realizadoCheck.checked : true;

        if(item.tipo === "cardio") {
            let mins = parseInt(document.getElementById('guiado-cardio-mins')?.value) || item.minutos || 20;
            borradorSesion.progresoEjercicios[guiadoIndice] = { nombre: item.nombre, tipo: "cardio", minutos: mins, realizado };
        } else {
            let p = parseFloat(document.getElementById('guiado-peso')?.value) || 0;
            let r = document.getElementById('guiado-reps')?.value || item.reps;
            borradorSesion.progresoEjercicios[guiadoIndice] = { nombre: item.nombre, tipo: "fuerza", series: item.series, peso: p, reps: r, realizado };
        }
        guardarProgresoActualBorrador();
    }

    function finalizarEntrenamientoGuiado() {
        guardarPasoActualBorradorParcial();
        if(cronometroSesionInterval) clearInterval(cronometroSesionInterval);
        if(descansoInterval) clearInterval(descansoInterval);

        const lista = rutinasPersonalizadas[rutinaSeleccionadaKey] || [];
        let ahora = new Date();
        let fechaStr = ahora.toLocaleDateString();
        let horaStr = ahora.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

        let volumenTotalSesion = 0;
        let caloriasTotalesSesion = 0;
        let detalleEjercicios = [];

        lista.forEach((item, idx) => {
            let datosProgreso = borradorSesion?.progresoEjercicios?.[idx];
            let realizado = datosProgreso ? datosProgreso.realizado : true;

            if(realizado) {
                if(item.tipo === "cardio") {
                    let mins = datosProgreso?.minutos || item.minutos || 20;
                    let kcal = mins * 9;
                    caloriasTotalesSesion += kcal;
                    detalleEjercicios.push({ nombre: item.nombre, tipo: "cardio", minutos: mins, calorias: kcal, realizado: true });
                } else {
                    let p = datosProgreso?.peso || item.pesoRef || 0;
                    let r = datosProgreso?.reps || item.reps;
                    let repsArr = String(r).split(/[-,\s]+/).map(x => parseInt(x)).filter(x => !isNaN(x));
                    let totalReps = repsArr.reduce((a,b)=>a+b, 0) || (item.series * 10);
                    let vol = p * totalReps;
                    volumenTotalSesion += vol;
                    let kcal = 40; 
                    caloriasTotalesSesion += kcal;
                    detalleEjercicios.push({ nombre: item.nombre, tipo: "fuerza", series: item.series, peso: p, reps: r, volumen: vol, realizado: true });
                }
            } else {
                detalleEjercicios.push({ nombre: item.nombre, realizado: false });
            }
        });

        let registroFinal = {
            id: Date.now(),
            fecha: fechaStr,
            hora: horaStr,
            rutina: rutinaSeleccionadaKey,
            volumen: volumenTotalSesion,
            calorias: caloriasTotalesSesion,
            duracionMin: Math.floor(segundosSesion / 60),
            detalle: detalleEjercicios
        };

        registrosCloud.unshift(registroFinal);
        borradorSesion = null;
        guardarTodoEnNube();

        alert(`🎉 ¡Entrenamiento guardado y sincronizado en la nube!\nVolumen total: ${volumenTotalSesion} kg\nCalorías aprox: ${caloriasTotalesSesion} kcal`);
        irA('view-home');
    }

    function consultarIA(tipo) {
        const box = document.getElementById('ia-respuesta-box');
        if (!box) return;
        box.style.display = 'block';
        box.innerText = "🤖 Analizando tus registros en la nube...";

        setTimeout(() => {
            let totalEntrenos = registrosCloud.length;
            let ultimo = totalEntrenos > 0 ? registrosCloud[0] : null;
            
            if(tipo === 'semanal') {
                box.innerText = `📊 ANÁLISIS SEMANAL (IA):\n\n` +
                `- Constancia: ¡Excelente ritmo de entrenamiento constante!\n` +
                `- Última sesión registrada (${ultimo ? ultimo.rutina : 'Ninguna'}): Volumen total de ${ultimo ? ultimo.volumen : 0} kg.\n` +
                `- Recomendación profesional: Aprovechá los pesos de referencia y notas detalladas para asegurar una progresión de cargas constante.`;
            } else {
                box.innerText = `📅 REPORTE MENSUAL (IA):\n\n` +
                `- Actividad Global: Tus rutinas con pesos personalizados se están ejecutando con gran consistencia.\n` +
                `- Recomendación profesional: Recordá validar las series y asegurar un descanso de 90 a 120 segundos para maximizar rendimiento.`;
            }
        }, 1000);
    }

    function renderizarHistorial() {
        const cont = document.getElementById('historial-lista-container');
        if (!cont) return;
        let html = '';
        if(registrosCloud.length === 0) {
            html = '<p style="color:var(--text-muted);">No hay entrenamientos guardados todavía.</p>';
        } else {
            registrosCloud.forEach(r => {
                html += `
                    <div style="background: #0f172a; padding: 14px; border-radius: 8px; margin-bottom: 12px; font-size: 0.9rem; border-left: 4px solid var(--accent); cursor: pointer;" onclick="abrirDetalleHistorial(${r.id})">
                        <div class="flex-row" style="justify-content: space-between;">
                            <strong style="color: var(--accent); font-size: 1rem;">📅 ${r.rutina}</strong>
                            <span style="color: var(--text-muted);">${r.fecha} - ${r.hora}</span>
                        </div>
                        <div style="margin-top: 6px;">Volumen total: <strong>${r.volumen || 0} kg</strong> | ⚡ Calorías: <strong style="color:var(--orange);">${r.calorias || 0} kcal</strong> | ⏱️ ${r.duracionMin || 0} mins</div>
                        <div style="color: var(--text-muted); font-size: 0.8rem; margin-top: 4px;">🔍 Hacé clic para ver detalle completo.</div>
                    </div>
                `;
            });
        }
        cont.innerHTML = html;
    }

    function abrirDetalleHistorial(id) {
        let r = registrosCloud.find(x => x.id === id);
        if(!r) return;

        const tituloModal = document.getElementById('modal-historial-titulo');
        const cuerpoModal = document.getElementById('modal-historial-cuerpo');
        const modalDetalle = document.getElementById('modal-detalle-historial');

        if (tituloModal) tituloModal.innerText = `Sesión: ${r.rutina} (${r.fecha})`;
        let html = `<p style="margin-bottom:8px; color:var(--text-muted);">⏱️ Duración: ${r.duracionMin || 0} min | Volumen: <b>${r.volumen} kg</b> | Calorías: <span style="color:var(--orange);">${r.calorias} kcal</span></p>`;
        html += `<h4 style="margin-top:10px; color:var(--accent);">Ejercicios Realizados:</h4>`;
        
        if(r.detalle && r.detalle.length > 0) {
            r.detalle.forEach(d => {
                if(d.realizado) {
                    if(d.tipo === "cardio") {
                        html += `<div style="background:#0f172a; padding:8px; border-radius:6px; margin-top:6px;">• <b>${d.nombre}</b>: ${d.minutos} mins</div>`;
                    } else {
                        html += `<div style="background:#0f172a; padding:8px; border-radius:6px; margin-top:6px;">• <b>${d.nombre}</b><br>&nbsp;&nbsp;Peso: <b>${d.peso} kg</b> | Reps: <b>${d.reps}</b> | Vol: ${d.volumen} kg</div>`;
                    }
                } else {
                    html += `<div style="background:#0f172a; padding:8px; border-radius:6px; margin-top:6px; opacity:0.6;">• <b>${d.nombre}</b> (No realizado)</div>`;
                }
            });
        } else {
            html += `<p>Sin detalles específicos registrados.</p>`;
        }

        if (cuerpoModal) cuerpoModal.innerHTML = html;
        if (modalDetalle) modalDetalle.style.display = 'flex';
    }
    
    function cerrarModalHistorial() { 
        const modalDetalle = document.getElementById('modal-detalle-historial');
        if (modalDetalle) modalDetalle.style.display = 'none'; 
    }

    function renderizarCalendario() {
        const meses = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Setiembre", "Octubre", "Noviembre", "Diciembre"];
        const mesAnioTitulo = document.getElementById('cal-mes-anio-titulo');
        if (mesAnioTitulo) mesAnioTitulo.innerText = `${meses[calMesActual]} ${calAnioActual}`;

        let primerDia = new Date(calAnioActual, calMesActual, 1).getDay();
        primerDia = primerDia === 0 ? 6 : primerDia - 1;
        let totalDias = new Date(calAnioActual, calMesActual + 1, 0).getDate();

        let diasEntrenados = {};
        registrosCloud.forEach(r => {
            if (!r.fecha) return;
            let p = r.fecha.split('/');
            if(p.length === 3 && parseInt(p[1]) === (calMesActual + 1) && parseInt(p[2]) === calAnioActual) {
                diasEntrenados[parseInt(p[0])] = r.rutina;
            }
        });

        let grid = '';
        for(let i=0; i<primerDia; i++) grid += `<div class="cal-day" style="opacity:0; border:none;"></div>`;
        
        let hoy = new Date();
        for(let d=1; d<=totalDias; d++) {
            let ent = diasEntrenados[d];
            let esHoy = (d === hoy.getDate() && calMesActual === hoy.getMonth() && calAnioActual === hoy.getFullYear());
            let cls = ent ? 'trained' : '';
            if(esHoy) cls += ' today';

            grid += `
                <div class="cal-day ${cls}" onclick="alert('${ent ? `Entrenamiento registrado: ${ent}` : 'Sin entrenamientos este día'}')">
                    <strong>${d}</strong>
                    <span style="font-size:0.55rem; white-space:nowrap; overflow:hidden; max-width:100%;">${ent || ''}</span>
                </div>
            `;
        }
        const diasGrid = document.getElementById('cal-dias-grid');
        if (diasGrid) diasGrid.innerHTML = grid;
    }

    function cambiarMesCalendario(dir) {
        calMesActual += dir;
        if(calMesActual > 11) { calMesActual = 0; calAnioActual++; }
        if(calMesActual < 0) { calMesActual = 11; calAnioActual--; }
        renderizarCalendario();
    }

    function renderizarRecords() {
        const cont = document.getElementById('records-container');
        if (cont) cont.innerHTML = '<div class="card"><p style="color:var(--text-muted);">Tus récords personales (PRs) se calculan automáticamente y se actualizan con cada sesión registrada en la nube.</p></div>';
    }

    function abrirCalculadoraDiscos() { 
        const modal = document.getElementById('modal-discos');
        if (modal) modal.style.display = 'flex'; 
        calcularDiscos(); 
    }
    
    function cerrarCalculadoraDiscos() { 
        const modal = document.getElementById('modal-discos');
        if (modal) modal.style.display = 'none'; 
    }
    
    function calcularDiscos() {
        const totalInput = document.getElementById('calc-peso-total');
        const barraInput = document.getElementById('calc-peso-barra');
        const container = document.getElementById('resultado-discos');
        if (!totalInput || !barraInput || !container) return;

        const total = parseFloat(totalInput.value);
        const barra = parseFloat(barraInput.value);
        
        if(isNaN(total) || isNaN(barra) || total < barra) { container.innerHTML = "Peso inválido."; return; }
        let resto = (total - barra) / 2;
        if(resto <= 0) { container.innerHTML = "Solo la barra."; return; }
        let res = `Por lado necesitás:<br>`;
        [20, 15, 10, 5, 2.5, 1.25].forEach(d => {
            let cant = Math.floor(resto / d);
            if(cant > 0) { res += `• ${cant} disco(s) de ${d}kg<br>`; resto = +(resto - (cant*d)).toFixed(2); }
        });
        container.innerHTML = res;
    }

    function abrirModalPesoCorporal() { 
        const pesoCorpInput = document.getElementById('input-nuevo-peso-corp');
        const modalPeso = document.getElementById('modal-peso-corporal');
        if (pesoCorpInput) pesoCorpInput.value = perfilCloud.peso || ''; 
        if (modalPeso) modalPeso.style.display = 'flex'; 
    }
    
    function cerrarModalPesoCorporal() { 
        const modalPeso = document.getElementById('modal-peso-corporal');
        if (modalPeso) modalPeso.style.display = 'none'; 
    }
    
    function guardarPesoCorporalCloud() {
        let inputPeso = document.getElementById('input-nuevo-peso-corp');
        if (!inputPeso) return;
        let p = parseFloat(inputPeso.value);
        if(!isNaN(p)) {
            perfilCloud.peso = p;
            guardarTodoEnNube();
            cerrarModalPesoCorporal();
            actualizarDashboard();
        }
    }

    sincronizarConNubeAlIniciar();
</script>
